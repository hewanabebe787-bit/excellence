
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student profile page</title>
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="student.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <script src="../js/shared-components.js" defer></script>
</head>

<body>

    <header id="navbar" class="navbar"></header>

    <main class="student-page student-profile-page">
        <div class="student-card">
            <section class="student-intro">
                <h1>Your Student Profile</h1>
                <p>Review and update your contact and learning information.</p>
            </section>
            
            <section class="student-account" aria-label="Student account">
                <div class="account-avatar" aria-hidden="true">
                    <i class="fa-solid fa-user"></i>
                </div>
            
                <div class="account-details">
                    <p class="account-label">ACCOUNT OVERVIEW</p>
                    <h2 id="account-name"></h2>
                    <p class="account-email">
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                        <span id="account-email"></span>
                    </p>
                </div>
            
                <div class="account-role">
                    <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                    Student
                </div>
            </section>
    
            <section class="student-form">
                <h2>Profile details</h2>
    
                <form id="profile-form" method="post">
                    <div class="form-group">
                        <label for="profile-phone">Phone number</label>
                        <input id="profile-phone" name="phoneNumber" type="tel" maxlength="30">
                    </div>
    
                    <div class="form-group">
                        <label for="profile-education">Education level</label>
                        <input id="profile-education" name="educationLevel" type="text" maxlength="80">
                    </div>
    
                    <div class="form-group">
                        <label for="profile-school">School name</label>
                        <input id="profile-school" name="schoolName" type="text" maxlength="160">
                    </div>
    
                    <div class="form-group">
                        <label for="profile-goals">Learning goals</label>
                        <textarea id="profile-goals" name="learningGoals" rows="5" maxlength="5000"></textarea>
                    </div>
    
                    <p id="profile-error" role="alert"></p>
                    <p id="profile-status" role="status" aria-live="polite"></p>
    
                    <button type="submit" class="btn-primary">Save profile</button>
                </form>
            </section>
            
            <section class="student-requests">
                <h2>Create a tutor request</h2>
            
                <form id="request-form">
                    <div class="form-group">
                        <label for="request-subject">Subject</label>
                        <input
                            id="request-subject"
                            name="subject"
                            type="text"
                            maxlength="120"
                            required
                        >
                    </div>
            
                    <div class="form-group">
                        <label for="request-details">Additional notes</label>
                        <textarea
                            id="request-details"
                            name="details"
                            rows="4"
                            maxlength="5000"
                        ></textarea>
                    </div>
            
                    <div class="form-group">
                        <label for="request-fee-min">Minimum fee</label>
                        <input id="request-fee-min" name="feeMin" type="number" min="0" step="0.01">
                    </div>
            
                    <div class="form-group">
                        <label for="request-fee-max">Maximum fee</label>
                        <input id="request-fee-max" name="feeMax" type="number" min="0" step="0.01">
                    </div>
            
                    <p id="request-error" role="alert"></p>
                    <p id="request-status" role="status" aria-live="polite"></p>
            
                    <button type="submit" class="btn-primary">Submit tutor request</button>
                </form>
            </section>

            <section class="student-requests">
                <h2>My tutor requests</h2>
                <div id="requests-list" aria-live="polite">Loading requests...</div>
            </section>
            
        </div>
    </main>
    <div id="footer"></div>
    <script src="profile.js" defer></script>
</body>
</html>
