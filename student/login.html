
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Excellence Tutor</title>
  <link rel="stylesheet" href="student.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="student-page">
    <div class="student-card">
      <section class="student-intro">
        <h1>Welcome back</h1>
        <p>Sign in to continue to your account.</p>
      </section>

      <section class="student-form">
        <h2>Sign In</h2>
        <p id="login-role" class="login-role" aria-live="polite"></p>
        <form id="login-form" class="form-container" method="POST">
          <div class="form-group">
            <label for="login-email">Email address</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password"
                   autocomplete="current-password" minlength="8" required>
          </div>

          <p id="login-error" role="alert"></p>
          <button type="submit" class="btn-primary">Sign In</button>
        </form>
      </section>
    </div>
  </main>

  <div id="footer"></div>
  <script src="../js/shared-components.js"></script>
  <script src="login.js"></script>
</body>
</html>
